name: z386 ULX3S CPU probe

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpga-builds-${{ github.ref }}
  cancel-in-progress: false

env:
  OSS_CAD_SUITE_VERSION: "2026-07-20"

jobs:
  build:
    name: ULX3S 85F CPU probe
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ULX3S 85F
            board: ulx3s-85f
            command: make probe
            bitstream: build/ulx3s/fpga_ulx3s.bit

           # ULX4M-LD support is planned but not yet implemented.
#          - name: ULX4M-LD 85F
#            board: ulx4m-ld-85f
#            command:
#            bitstream: build/ulx4m-ld/fpga_ulx4m_ld.bit

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install GNU Make
        shell: bash
        run: |
          if ! command -v make >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install --yes make
          fi

          make --version

      - name: Set up the pinned OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ github.token }}
          python-override: true

      - name: Show FPGA tool versions
        shell: bash
        run: |
          yosys --version
          nextpnr-ecp5 --version
          printf 'ecppack: %s\n' "$(command -v ecppack)"

      - name: Initialize required submodules
        shell: bash
        run: ./scripts/setup-submodules.sh

      - name: Build board image
        shell: bash
        run: |
          ${{ matrix.command }}

          test -s "${{ matrix.bitstream }}"

      - name: Upload board artifacts and timing logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.board }}-${{ github.sha }}
          path: |
            ${{ matrix.bitstream }}
            build/z386_ulx3s_cpu_probe.json
            build/z386_ulx3s_cpu_probe.config
            build/z386_ulx3s_cpu_probe.ys
            build/yosys.log
            build/nextpnr.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
